name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      validation_only:
        description: Run all release gates without publishing Pages
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ inputs.validation_only && format('pages-validation-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test:ci
      - name: Build
        run: npm run build
      - name: Prepare Chrome for Playwright
        run: npx playwright install --with-deps chrome
      - name: Release browser acceptance (production preview)
        # Runs against the built dist via `vite preview`; a failure here stops
        # the Pages upload.
        #  - `save-concurrency.spec.ts`: the save-persistence gate. It exercises
        #    the production IndexedDB compare-and-commit protocol across
        #    same-origin documents, including conflict, unload recovery and
        #    transaction rollback, so an autosave/recovery regression cannot ship
        #    unnoticed.
        #  - `lifecycle-acceptance.spec.ts`: the R04–R06 gate (subscription
        #    billing, gig UI contract, shift-boundary hiring) through the real UI.
        run: npx playwright test e2e/ui-architecture.spec.ts e2e/boot-failure.spec.ts e2e/save-concurrency.spec.ts e2e/lifecycle-acceptance.spec.ts e2e/investment-study.spec.ts --project=desktop
        env:
          YULIANG_E2E_SERVER: preview
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: test-results/
          retention-days: 7
      - name: Configure Pages
        if: inputs.validation_only != true
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: inputs.validation_only != true
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: inputs.validation_only != true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
